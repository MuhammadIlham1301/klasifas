# Kerangka konfigurasi Nginx untuk KlasiFas.
# Ganti example.com dan path sertifikat sebelum dipakai.
# HSTS sengaja dinonaktifkan sampai HTTPS terverifikasi pada server nyata.
#
# Tahap hardening berikutnya (belum aktif, konteks http):
# limit_req_zone $binary_remote_addr zone=report_limit:10m rate=5r/m;
# limit_req_status 429;

upstream klasifas_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    access_log /var/log/nginx/klasifas.access.log;
    error_log /var/log/nginx/klasifas.error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout 15s;

    # Aktifkan baris HSTS ini HANYA setelah HTTPS terverifikasi:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/klasifas.access.log;
    error_log /var/log/nginx/klasifas.error.log warn;

    location /static/ {
        alias /opt/klasifas/app/static/;
        expires 7d;
        access_log off;
    }

    location /uploads/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://klasifas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
